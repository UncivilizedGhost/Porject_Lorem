<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<title>Warning signs · Pathway Companion</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{margin:0}
a{color:#0a6670}a:hover{color:#074d55}
a.btn,button{transition:transform .12s ease,filter .15s ease}
a.btn:hover,button:hover{filter:brightness(.96)}
a.btn:active,button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="app-frame">
<div class="screen" style="width: 100%; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #1d2a2e; background: #f6f4f0">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0 4px">
<a href="risk-check.html" aria-label="Back" style="min-width: 56px; min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="40" height="40" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#0a6670" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span style="display: flex; gap: 6px">
<button aria-label="Read this page aloud" style="width: 48px; height: 48px; border: 1px solid #e2ddd5; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 9h3.5L11 5.5v11L6.5 13H3z" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linejoin="round"></path><path d="M14.5 8a4 4 0 010 6M17 5.5a7.5 7.5 0 010 11" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
<a href="accessibility.html" aria-label="Language, text size and voice" class="btn" style="min-width: 48px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e2ddd5; border-radius: 999px; background: #ffffff; color: #1d2a2e; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Aa</a>
<a href="help.html" class="btn" style="height: 48px; padding: 0 14px; border-radius: 999px; background: #1d2a2e; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3l1.5 4-2 1.2a9 9 0 004.3 4.3l1.2-2 4 1.5v3a1.5 1.5 0 01-1.6 1.5A14 14 0 013.5 4.6 1.5 1.5 0 015 3z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path></svg>Help</a>
</span>
</div>
<div style="padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Five signs worth telling a nurse</h1>

</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">



<button style="min-height: 116px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; font: inherit; color: #1d2a2e; border-radius: 18px; grid-column: auto; background: #ffffff; border: 1px solid #e2ddd5; padding: 14px"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M8 7c-3 2-4 5-4 8s2 7 6 7h1M22 7c3 2 4 5 4 8s-2 7-6 7h-1M15 4v11M15 15l-4 4M15 15l4 4" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#a59d91" stroke-width="2"></circle></svg></span><span style="font-size: 17px; font-weight: 700; line-height: 1.25">A cough that keeps getting worse</span></button>



<button style="min-height: 116px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; font: inherit; color: #1d2a2e; border-radius: 18px; grid-column: auto; background: #ddeeec; border: 2px solid #0a6670; padding: 13px"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4a4 4 0 014 4v6a4 4 0 01-8 0V8a4 4 0 014-4zM8 14a7 7 0 0014 0M15 21v5" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0a6670"></circle><path d="M7 12.5l3.5 3.5 6.5-7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; font-weight: 700; line-height: 1.25">Hoarse voice for over 3 weeks</span><span style="font-size: 14px; line-height: 1.35; color: #074d55">Sent. Nurse Aino will call you by Wednesday.</span></span></button>





<button style="min-height: 116px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; font: inherit; color: #1d2a2e; border-radius: 18px; grid-column: auto; background: #ffffff; border: 1px solid #e2ddd5; padding: 14px"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4c5 6 7 9 7 12a7 7 0 01-14 0c0-3 2-6 7-12z" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#a59d91" stroke-width="2"></circle></svg></span><span style="font-size: 17px; font-weight: 700; line-height: 1.25">Coughing up blood</span></button>




<button style="min-height: 116px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; font: inherit; color: #1d2a2e; border-radius: 18px; grid-column: auto; background: #ffffff; border: 1px solid #e2ddd5; padding: 14px"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M20 6a9 9 0 100 18 10 10 0 01-6-9 10 10 0 016-9z" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#a59d91" stroke-width="2"></circle></svg></span><span style="font-size: 17px; font-weight: 700; line-height: 1.25">Tiredness that does not pass</span></button>




<button style="min-height: 116px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; font: inherit; color: #1d2a2e; border-radius: 18px; grid-column: span 2; background: #ffffff; border: 1px solid #e2ddd5; padding: 14px"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M8 4v8a3 3 0 006 0V4M11 4v22M22 4c-3 2-4 6-4 10h4v12" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#a59d91" stroke-width="2"></circle></svg></span><span style="font-size: 17px; font-weight: 700; line-height: 1.25">Poor appetite</span></button>


</div>
<div style="font-size: 15px; line-height: 1.45; padding: 12px 14px; background: #fbe8e5; color: #8c1f17; border-radius: 14px">Heavy bleeding or struggling to breathe: call 112.</div>

</div>

<a href="home.html" style="min-height: 60px; margin: 0 20px 20px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #0a6670; color: #ffffff; text-decoration: none; font-size: 19px; font-weight: 700">Continue to your pathway</a>
</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
