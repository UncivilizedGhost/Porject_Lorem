<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<title>Call now · Pathway Companion</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{margin:0}
a{color:#0a6670}a:hover{color:#074d55}
a.btn,button{transition:transform .12s ease,filter .15s ease}
a.btn:hover,button:hover{filter:brightness(.96)}
a.btn:active,button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="app-frame">
<div class="screen" style="width: 100%; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #1d2a2e; background: #fbe8e5">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0 4px">
<a href="report-pick.html" aria-label="Back" style="min-width: 56px; min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="40" height="40" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#8c1f17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span style="display: flex; gap: 6px">
<button aria-label="Read this page aloud" style="width: 48px; height: 48px; border: 1px solid #e9b8b1; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 9h3.5L11 5.5v11L6.5 13H3z" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linejoin="round"></path><path d="M14.5 8a4 4 0 010 6M17 5.5a7.5 7.5 0 010 11" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
<a href="accessibility.html" aria-label="Language, text size and voice" class="btn" style="min-width: 48px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e9b8b1; border-radius: 999px; background: #ffffff; color: #1d2a2e; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Aa</a>
<a href="help.html" class="btn" style="height: 48px; padding: 0 14px; border-radius: 999px; background: #1d2a2e; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3l1.5 4-2 1.2a9 9 0 004.3 4.3l1.2-2 4 1.5v3a1.5 1.5 0 01-1.6 1.5A14 14 0 013.5 4.6 1.5 1.5 0 015 3z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path></svg>Help</a>
</span>
</div>
<div role="alert" style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 18px; flex: 1">
<svg width="48" height="48" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3l9 16H2z" fill="none" stroke="#b02a20" stroke-width="1.7" stroke-linejoin="round"></path><path d="M11 9v4.5M11 16v.5" stroke="#b02a20" stroke-width="1.7" stroke-linecap="round"></path></svg>
<h1 style="margin: 0; font-size: 38px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; color: #8c1f17">Please call now.</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.4">You told us you are very unwell. This needs to be checked today.</p>
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 4px">
<a href="tel:112" class="btn" style="min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; background: #b02a20; color: #ffffff; text-decoration: none; width: 355px; height: 156px"><span style="font-size: 30px; font-weight: 700">Call 112</span><span style="font-size: 18px">If it feels like an emergency</span></a>
<a href="tel:116117" class="btn" style="min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; background: #1d2a2e; color: #ffffff; text-decoration: none; width: 350px; height: 147px"><span style="font-size: 30px; font-weight: 700">Call 116 117</span><span style="font-size: 18px">Medical helpline</span></a>
</div>
<p style="margin: 0; font-size: 21px; line-height: 1.4">Or go to the nearest emergency department.</p>
<div style="margin-top: auto; padding: 16px 18px; border-radius: 18px; background: #ffffff; font-size: 20px; line-height: 1.4">We have told Nurse Aino too.</div>
</div>
</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
