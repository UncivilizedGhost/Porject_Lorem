<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<title>Demo login · Pathway Companion</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{margin:0}
a{color:#0a6670}a:hover{color:#074d55}
a.tile{transition:transform .15s ease,box-shadow .15s ease}
a.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(29,42,46,.08)}
</style>
</head>
<body>
<div class="app-frame">
<div class="screen" style="width: 100%; min-height: 100%; box-sizing: border-box; padding: 48px 20px 24px; display: flex; flex-direction: column; gap: 22px; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #1d2a2e; background: #f6f4f0">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#0a6670" stroke-width="2.5"></circle><path d="M16 8v8l5 3" fill="none" stroke="#0a6670" stroke-width="2.5" stroke-linecap="round"></path></svg>
<span style="font-size: 22px; font-weight: 700">Pathway Companion</span>
</div>
<h1 style="margin: 12px 0 0; font-size: 36px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Lung cancer pathway support for Western Uusimaa</h1>

</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<a href="risk-check.html" class="tile" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 18px; min-height: 76px; background: #ffffff; border: 1px solid #e2ddd5; border-radius: 18px; text-decoration: none; color: #1d2a2e">
<span style="font-size: 25px; font-weight: 700; line-height: 1.2">Patient</span>
<svg width="28" height="28" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>

<a href="support-person.html" class="tile" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 18px; min-height: 76px; background: #ffffff; border: 1px solid #e2ddd5; border-radius: 18px; text-decoration: none; color: #1d2a2e">
<span style="font-size: 25px; font-weight: 700; line-height: 1.2">Support person</span>
<svg width="28" height="28" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>

<a aria-disabled="true" data-unavailable href="#" class="tile" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 18px; min-height: 76px; background: #ffffff; border: 1px solid #e2ddd5; border-radius: 18px; text-decoration: none; color: #1d2a2e">
<span style="font-size: 25px; font-weight: 700; line-height: 1.2">Coordinator nurse</span>
<svg width="28" height="28" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>

<a aria-disabled="true" data-unavailable href="#" class="tile" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 18px; min-height: 76px; background: #ffffff; border: 1px solid #e2ddd5; border-radius: 18px; text-decoration: none; color: #1d2a2e">
<span style="font-size: 25px; font-weight: 700; line-height: 1.2">County decision-maker</span>
<svg width="28" height="28" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>

</div>


<p style="margin: 0; font-size: 15px; line-height: 1.35; color: #4b575b">Coordinator nurse and county decision-maker are not part of this demo.</p>
</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
