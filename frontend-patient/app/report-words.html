<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<title>Report a symptom: in your own words · Pathway Companion</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{margin:0}
a{color:#0a6670}a:hover{color:#074d55}
a.btn,button{transition:transform .12s ease,filter .15s ease}
a.btn:hover,button:hover{filter:brightness(.96)}
a.btn:active,button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="app-frame">
<div class="screen" style="width: 100%; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #1d2a2e; background: #f6f4f0">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0 4px">
<a href="report-question.html" aria-label="Back" style="min-width: 56px; min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="40" height="40" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#0a6670" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span style="display: flex; gap: 6px">
<button aria-label="Read this page aloud" style="width: 48px; height: 48px; border: 1px solid #e2ddd5; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 9h3.5L11 5.5v11L6.5 13H3z" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linejoin="round"></path><path d="M14.5 8a4 4 0 010 6M17 5.5a7.5 7.5 0 010 11" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
<a href="accessibility.html" aria-label="Language, text size and voice" class="btn" style="min-width: 48px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e2ddd5; border-radius: 999px; background: #ffffff; color: #1d2a2e; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Aa</a>
<a href="help.html" class="btn" style="height: 48px; padding: 0 14px; border-radius: 999px; background: #1d2a2e; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3l1.5 4-2 1.2a9 9 0 004.3 4.3l1.2-2 4 1.5v3a1.5 1.5 0 01-1.6 1.5A14 14 0 013.5 4.6 1.5 1.5 0 015 3z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path></svg>Help</a>
</span>
</div>

<div style="padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 600; color: #0a6670">Almost done</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Anything to add in your own words?</h1>
</div>
<label style="background: #f5e6d8; border-radius: 20px 20px 20px 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; color: #5a3a22">You said. Tap the text to change it.<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17l1-4 9-9 3 3-9 9zM12 5l3 3" fill="none" stroke="#6b3511" stroke-width="1.7" stroke-linejoin="round"></path></svg></span>
<textarea>Since the weekend I get out of breath on the stairs up to our flat. I have to stop halfway.</textarea>
</label>
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Hold to speak" style="width: 72px; height: 72px; flex-shrink: 0; border: 0; border-radius: 999px; background: #1d2a2e; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #ddeeec"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"></rect><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path></svg></button>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 19px; font-weight: 700">Hold to speak</span><span style="font-size: 16px; color: #4b575b">Or tap the text to type</span></span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<button class="btn" style="min-height: 64px; border: 0; border-radius: 16px; background: #0a6670; color: #ffffff; font: inherit; font-size: 21px; font-weight: 700" data-href="report-sent.html">Send to Nurse Aino</button>
<a href="report-pick.html" class="btn" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; border: 1px solid #cfc8bd; background: #ffffff; color: #1d2a2e; text-decoration: none; font-size: 18px; font-weight: 600">Add another symptom</a>
</div>
</div>


</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
