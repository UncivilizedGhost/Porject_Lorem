<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<title>Weekly check-in · Pathway Companion</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{margin:0}
a{color:#0a6670}a:hover{color:#074d55}
a.btn,button{transition:transform .12s ease,filter .15s ease}
a.btn:hover,button:hover{filter:brightness(.96)}
a.btn:active,button:active{transform:scale(.98)}
label.opt:focus-within{outline:3px solid #0a6670;outline-offset:2px}
</style>
</head>
<body>
<div class="app-frame">
<div class="screen" style="width: 100%; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #1d2a2e; background: #f6f4f0">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0 4px">
<a href="home.html" aria-label="Back" style="min-width: 56px; min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="40" height="40" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#0a6670" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span style="display: flex; gap: 6px">
<button aria-label="Read this page aloud" style="width: 48px; height: 48px; border: 1px solid #e2ddd5; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 9h3.5L11 5.5v11L6.5 13H3z" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linejoin="round"></path><path d="M14.5 8a4 4 0 010 6M17 5.5a7.5 7.5 0 010 11" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
<a href="accessibility.html" aria-label="Language, text size and voice" class="btn" style="min-width: 48px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e2ddd5; border-radius: 999px; background: #ffffff; color: #1d2a2e; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Aa</a>
<a href="help.html" class="btn" style="height: 48px; padding: 0 14px; border-radius: 999px; background: #1d2a2e; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3l1.5 4-2 1.2a9 9 0 004.3 4.3l1.2-2 4 1.5v3a1.5 1.5 0 01-1.6 1.5A14 14 0 013.5 4.6 1.5 1.5 0 015 3z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path></svg>Help</a>
</span>
</div>
<div style="padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Weekly check-in</h1>
<div style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #4b575b">
<div style="flex: 1; height: 8px; border-radius: 999px; background: #e7e2da; overflow: hidden"><div style="height: 8px; width: 40%; background: #0a6670; border-radius: 999px"></div></div>
<span>4 of 10</span>
</div>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px"><legend style="margin: 0 0 12px; padding: 0; font-size: 24px; font-weight: 700; line-height: 1.2">Have you had a fever in the last 7 days?</legend><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label class="opt" style="position: relative; min-height: 96px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; background: #ffffff; border: 1px solid #e2ddd5; padding: 14px; border-radius: 18px; color: #1d2a2e"><input type="radio" name="f" style="position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4a11 11 0 100 22 11 11 0 000-22zM10 15.5l4 4 7-8" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#a59d91" stroke-width="2"></circle></svg></span><span style="font-size: 19px; font-weight: 700; line-height: 1.25">No</span></label><label class="opt" style="position: relative; min-height: 96px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; background: #ddeeec; border: 2px solid #0a6670; padding: 13px; border-radius: 18px; color: #1d2a2e"><input type="radio" name="f" checked style="position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0"><span style="display: flex; justify-content: space-between; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M13 5a3 3 0 016 0v11a5 5 0 11-6 0zM16 12v8" fill="none" stroke="#0a6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0a6670"></circle><path d="M7 12.5l3.5 3.5 6.5-7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="font-size: 19px; font-weight: 700; line-height: 1.25">Yes</span></label></div><label style="display: flex; flex-direction: column; gap: 6px; font-size: 17px; font-weight: 600">Highest temperature, °C<input value="38,6" inputmode="decimal" style="min-height: 56px; border: 1px solid #8f9a9d; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 19px; font-weight: 400; color: #1d2a2e"></label></fieldset>
<div role="alert" style="background: #fbe8e5; border: 2px solid #b02a20; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: #8c1f17"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3l9 16H2z" fill="none" stroke="#8c1f17" stroke-width="1.9" stroke-linejoin="round"></path><path d="M11 9v4.5M11 16v.5" stroke="#8c1f17" stroke-width="1.9" stroke-linecap="round"></path></svg>Call now</div>
<div style="font-size: 16px; line-height: 1.45">A fever of 38 °C or more during treatment needs care today. Nurse Aino has also been told.</div>
<a href="tel:116117" class="btn" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #b02a20; color: #ffffff; text-decoration: none; font-size: 18px; font-weight: 700">Call 116 117</a>
<span style="font-size: 15px">Very unwell or struggling to breathe: call 112.</span>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="min-height: 56px; border: 1px solid #cfc8bd; border-radius: 14px; background: #ffffff; color: #1d2a2e; font: inherit; font-size: 17px; font-weight: 600" data-href="home.html">Previous</button>
<button style="min-height: 56px; border: 0; border-radius: 14px; background: #0a6670; color: #ffffff; font: inherit; font-size: 17px; font-weight: 600" data-href="home.html">Next question</button>
</div>
</div>
</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
