<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<title>Confirm appointment · Pathway Companion</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{margin:0}
a{color:#a8dcd8}a:hover{color:#ffffff}
a.btn,button{transition:transform .12s ease,filter .15s ease}
a.btn:hover,button:hover{filter:brightness(1.08)}
a.btn:active,button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="app-frame">
<div class="screen" style="width: 100%; min-height: 100%; box-sizing: border-box; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 22px; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #ffffff; background: #1d2a2e">
<div style="display: flex; justify-content: space-between; align-items: center; margin: 0 -10px 0 -14px">
<a href="home.html" aria-label="Back" style="min-width: 56px; min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="40" height="40" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#a8dcd8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span style="display: flex; gap: 6px">
<button aria-label="Read this page aloud" style="width: 48px; height: 48px; border: 1px solid #3f5359; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 9h3.5L11 5.5v11L6.5 13H3z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path><path d="M14.5 8a4 4 0 010 6M17 5.5a7.5 7.5 0 010 11" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
<a href="accessibility.html" aria-label="Language, text size and voice" class="btn" style="min-width: 48px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3f5359; border-radius: 999px; background: transparent; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Aa</a>
<a href="help.html" class="btn" style="height: 48px; padding: 0 14px; border-radius: 999px; background: #ffffff; color: #1d2a2e; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3l1.5 4-2 1.2a9 9 0 004.3 4.3l1.2-2 4 1.5v3a1.5 1.5 0 01-1.6 1.5A14 14 0 013.5 4.6 1.5 1.5 0 015 3z" fill="none" stroke="#1d2a2e" stroke-width="1.7" stroke-linejoin="round"></path></svg>Help</a>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
<span style="font-size: 17px; color: #c9d2d4">Please confirm you can come</span>
<h1 style="margin: 0; font-size: 36px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em">Chest CT scan</h1>
<span style="font-size: 22px">Wednesday 18.11. at 9.30</span>
<span style="font-size: 18px; color: #c9d2d4">Jorvi Hospital, Espoo</span>
</div>
<div style="padding: 14px 16px; border-radius: 16px; background: #2a3a3f; font-size: 16px; line-height: 1.45; color: #e1e7e8">If we don't hear from you, an automated call comes on day 2 and Nurse Aino calls on day 3.</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<div role="slider" data-href="home.html" aria-label="Slide to confirm" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" style="position: relative; height: 72px; border-radius: 999px; background: #2a3a3f; border: 1px solid #3f5359; display: flex; align-items: center; justify-content: center">
<span style="font-size: 18px; font-weight: 600; color: #e1e7e8">Slide to confirm</span>
<span style="position: absolute; left: 6px; top: 6px; width: 60px; height: 60px; border-radius: 999px; background: #7fd0c8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#1d2a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</div>
<button style="min-height: 52px; border: 0; background: transparent; color: #a8dcd8; font: inherit; font-size: 17px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px" data-href="home.html">Or tap here to confirm</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="min-height: 56px; border: 1px solid #577075; border-radius: 14px; background: transparent; color: #ffffff; font: inherit; font-size: 16px; font-weight: 600">I need a new time</button>
<button style="min-height: 56px; border: 1px solid #577075; border-radius: 14px; background: transparent; color: #ffffff; font: inherit; font-size: 16px; font-weight: 600">Call Nurse Aino</button>
</div>
</div>
</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
