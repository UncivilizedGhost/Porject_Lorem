# Local Postgres for the build. `docker compose up -d` in server/, then the default
# DATABASE_URL (postgresql://pathway:pathway@localhost:5432/pathway) just works.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pathway
      POSTGRES_PASSWORD: pathway
      POSTGRES_DB: pathway
    ports:
      - "5432:5432"
    volumes:
      - pathway-pg:/var/lib/postgresql/data

volumes:
  pathway-pg:
