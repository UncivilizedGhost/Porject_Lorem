[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medml"
version = "0.1.0"
description = "A reproducible template for clinical / medical machine-learning projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "matplotlib>=3.8",
]

[project.scripts]
medml-train = "medml.train:main"
medml-predict = "medml.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
