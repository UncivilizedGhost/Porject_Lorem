# Default experiment configuration.
# Every key is optional; src/medml/config.py holds the defaults.
seed: 42

data:
  raw_path: data/processed/cohort.csv
  target: mortality_30d
  patient_id: patient_id
  encounter_id: encounter_id
  # Extra identifier / bookkeeping columns that must never become features.
  exclude_columns: []
  # Leave as null to infer numeric vs categorical from dtypes.
  numeric_columns: null
  categorical_columns: null
  # Patient-level split: 10 stratified group folds => 20% test, 10% val, 70% train.
  n_splits: 10
  test_folds: 2
  val_folds: 1
  cv_folds: 5
  run_cv: true
  # Regenerate a synthetic cohort if raw_path does not exist (dev convenience).
  synthetic_if_missing: true
  synthetic_patients: 900

features:
  derived: true
  # Columns to drop in addition to identifiers and the target.
  drop_columns: []

model:
  name: gradient_boosting # logistic_regression | random_forest | gradient_boosting
  params: {}

evaluation:
  threshold: 0.5
  optimize_threshold: true # pick the Youden-J operating point on validation
  subgroup_columns: [sex, age_group]
  min_subgroup_n: 20
  calibration_bins: 10
  n_bootstrap: 200
  decision_curve: true

output:
  run_dir: runs
  save_plots: true
  save_predictions: true
